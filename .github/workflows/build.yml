name: Build Android & iOS

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Android Build Job
  # =========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kmart_staff_portal-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # =========================================================================
  # iOS Build Job
  # =========================================================================
  build-ios:
    name: Build iOS IPA & App
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Release (Unsigned)
        run: |
          flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package iOS App into IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q kmart_staff_portal-ios-release.ipa Payload
          cd ../../..
          zip -r -q kmart_staff_portal-Runner.app.zip build/ios/iphoneos/Runner.app

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmart_staff_portal-ios-ipa
          path: build/ios/ipa/kmart_staff_portal-ios-release.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload Runner.app Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmart_staff_portal-ios-app-bundle
          path: kmart_staff_portal-Runner.app.zip
          if-no-files-found: error
          retention-days: 30

  # =========================================================================
  # Release Creation Job (Triggered on git tags like v1.0.0)
  # =========================================================================
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: kmart_staff_portal-android-release-apk
          path: release-artifacts

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: kmart_staff_portal-ios-ipa
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/app-release.apk
            release-artifacts/kmart_staff_portal-ios-release.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
